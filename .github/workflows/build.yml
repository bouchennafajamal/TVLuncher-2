name: Build TVLauncher 2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir project
          unzip TVLauncher-GitHub-Build.zip -d project
          find project -name gradlew -type f

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd project/TVLauncher
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVLauncher-APK
          path: project/TVLauncher/app/build/outputs/apk/debug/*.apk
